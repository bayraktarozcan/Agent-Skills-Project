# GitLab CI - ACTIVE pipeline for AgentSynapse
# Truth: badge image URLs are only trusted after live 200-SVG probes (see AGENTS.md).
# Valid profiles: temel, dengeli, tam.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

skills-syntax:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --version
    - python skills.py --list
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

skills-profile-coverage:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --check --profile temel
    - python skills.py --check --profile tam
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

skills-encoding:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - python Scripts/check_encoding.py --selftest
    - python Scripts/check_encoding.py --commits "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: alpine:3.21
  script:
    - mkdir -p public
    - cp -r Docs/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH