# GitLab CI - ACTIVE pipeline for AgentSynapse
# Truth: badge image URLs are only trusted after live 200-SVG probes (see AGENTS.md).
# Valid profiles: temel, dengeli, tam.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

skills-syntax:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --version
    - python skills.py --list
    - python Scripts/check_install_safety.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

skills-profile-coverage:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --check --profile temel
    - python skills.py --check --profile tam
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

skills-encoding:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - python Scripts/check_encoding.py --selftest
    - python Scripts/check_encoding.py --commits "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

link-check:
  stage: test
  image:
    name: lycheeverse/lychee:master-alpine
    entrypoint: [""]
  script:
    - lychee --no-progress --verbose --max-retries 2 --exclude '^file://' --exclude '^https://www\.iso\.org/standard/(77520|86308|86612)\.html$' './**/*.md'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
