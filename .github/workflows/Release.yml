name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.1.0)"
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical title
        id: meta
        run: |
          # Scripts/release_title.py <version> [--current]
          #   <version>   bare version (no leading v)
          #   --current   omit the [DEPRECATED] prefix (used for the live tag)
          # stdout line 1 = title (prefix at START), line 2 = short description.
          TITLE=$(python Scripts/release_title.py "${{ steps.version.outputs.version }}" --current | head -n 1)
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build artifact name
        id: artifact
        run: |
          ARCHIVE="skills.py"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: python -m py_compile skills.py

      - name: Generate checksum
        run: sha256sum skills.py > skills.py.sha256

      - name: Build release notes from template
        run: python Scripts/build_release_notes.py "${{ steps.version.outputs.version }}" RELEASE-NOTES.md

      - name: Create Release
        if: matrix.python-version == '3.x'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: RELEASE-NOTES.md
          draft: false
          prerelease: false
          files: |
            skills.py
            skills.py.sha256

      - name: Deprecate previous releases
        if: matrix.python-version == '3.x'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefix every older release title with [DEPRECATED] at the START.
          CUR="${{ steps.version.outputs.tag }}"
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name != "'"$CUR"'") | .id' |
          while read -r id; do
            title=$(gh api "repos/${{ github.repository }}/releases/$id" --jq .name)
            case "$title" in
              "[DEPRECATED] "*) ;;
              *) gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
                   -f name="[DEPRECATED] $title" >/dev/null ;;
            esac
          done
