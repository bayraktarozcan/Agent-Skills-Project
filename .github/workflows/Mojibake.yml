# AgentSynapse — Mojibake Gate
# Mirrors the GitLab `skills-encoding` job for GitHub: runs the same
# scripts/check_encoding.py on every push to main and every PR to main,
# regardless of which paths changed. Blocks merging content whose files,
# branch/tag refs or commit metadata carry encoding damage (invalid UTF-8 or
# double-encoded signatures). No badge is emitted (see AGENTS.md badge policy).

name: "Mojibake Gate"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encoding:
    name: Encoding Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full clone (not shallow): the "Lint pushed commit metadata" step
          # scans git log ranges like "${{ github.event.before }}..HEAD",
          # which require the base commit to be present locally. With the
          # default fetch-depth of 1 the base SHA is missing and git reports
          # "Invalid revision range".
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Self-test detectors
        run: python scripts/check_encoding.py --selftest
      - name: Lint tracked files and refs
        run: python scripts/check_encoding.py
      - name: Lint pushed commit metadata
        if: github.event_name == 'push'
        run: python scripts/check_encoding.py --commits "${{ github.event.before }}..${{ github.event.after }}"