# AgentSynapse — Link Check
# Checks Markdown links weekly and on PRs touching docs. Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Check links
        uses: lycheeverse/lychee-action@main
        with:
          # file:// = author-machine absolute paths, never valid in CI
          args: >-
            --no-progress --verbose --max-retries 2 --exclude '^file://'
            --exclude '^https://www\.iso\.org/standard/(77520|86308|86612)\.html$'
            './**/*.md'
          fail: true
