name: Pin Refresh

on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pin-refs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"

      - name: Compare registry pins with upstream HEAD
        id: check
        continue-on-error: true
        run: python Scripts/update_pin_refs.py --check

      - name: Open pin refresh PR
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create automated --description "Automated pull request" --color "ededed" 2>/dev/null || true
          gh label create auto-merge --description "Arm native auto-merge" --color "0e8a16" 2>/dev/null || true
          BRANCH="chore/refresh-source-pins"
          EXISTING=$(gh pr list --state open --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open; re-arming auto-merge."
            gh pr merge --squash --auto "$EXISTING"
            exit 0
          fi
          python Scripts/update_pin_refs.py
          python Scripts/check_version_parity.py
          python Scripts/check_install_integration.py --all || true
          if git diff --quiet; then
            echo "Pins already current; nothing to commit."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add skills.py
          git commit -m "chore(deps): refresh source commit pins"
          git push origin "$BRANCH"
          URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(deps): refresh source commit pins" \
            --body "Weekly refresh of the immutable commit pins in skills.py. Generated by .github/workflows/Pin-Refresh.yml after upstream HEAD advanced.")
          gh pr merge --squash --auto "$URL"
          echo "Opened pin refresh PR: ${URL}"
