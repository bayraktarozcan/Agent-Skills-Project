# AgentSynapse — Hygiene
# Lints workflow files with actionlint. Fails only in Actions tab.
# Note: codespell was evaluated and rejected — it flags correct Turkish words
# (bu, sistem, grup) and splits non-ASCII words into false fragments (nce, lke).

name: "Hygiene"

on:
  schedule:
    - cron: "45 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
      - name: Check Python floor parity
        run: python Scripts/python_floor.py check --offline
      - name: Check action reference invariants
        run: python Scripts/check_action_refs.py
      - name: Check repository file conventions
        run: python Scripts/check_repo_conventions.py
      - name: Check line endings
        run: python Scripts/check_line_endings.py
      - name: Check local gate / CI parity
        run: python Scripts/check_gate_parity.py
      - name: Audit published release hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Scripts/check_release_hygiene.py
      - name: Run actionlint
        uses: rhysd/actionlint@main
