# AgentSynapse — Dependabot Auto-Merge
# Auto-approves and merges Dependabot PRs once required status checks pass.
# Owner: @bayraktarozcan (sole maintainer, see CODEOWNERS).
#
# Rules (from AGENTS.md "Auto-approve"):
#   - Only trusted usernames may be auto-approved.
#   - After status checks pass.
#   - Logged.
#   - Minimal permissions: contents: write, pull-requests: write.
#
# This workflow is the gate that the AGENTS.md checklist item
# ".github/workflows/ auto-approve workflow added?" refers to.

name: Dependabot Auto-Merge

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-approve and merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Log PR context
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGEABLE: ${{ github.event.pull_request.mergeable }}
        run: |
          echo "PR #$PR_NUMBER: $PR_TITLE"
          echo "Author: $AUTHOR"
          echo "Head: $HEAD_REF → $BASE_REF"
          echo "Mergeable: $MERGEABLE"

      - name: Wait for status checks
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            data=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[(.check_runs | length),
                     ([.check_runs[] | select(.status != "completed" and .name != "Auto-approve and merge Dependabot PR")] | length),
                     ([.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length)] | @tsv')
            IFS=$'\t' read -r total pending failed <<< "$data"
            if [ "$failed" -gt 0 ]; then
              echo "Status checks failed: $failed"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All status checks completed successfully"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for status checks ($pending pending)"
              exit 1
            fi
            sleep 10
          done

      - name: Auto-approve
        if: success()
        run: gh pr review "$PR_NUMBER" --approve --body "Auto-approved by Dependabot Auto-Merge workflow — all required status checks passed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Enable auto-merge (squash)
        if: success()
        run: |-
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch "Merge commit message: chore(deps): $PR_TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  noop:
    name: Skip (non-Dependabot PR)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: No-op
        run: echo "Not a Dependabot PR — nothing to do."
