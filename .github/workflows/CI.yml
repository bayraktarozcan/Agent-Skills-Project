name: CI

on:
  push:
    branches: [main]
    paths:
      - "skills.py"
      - "Scripts/**"
      - "Tests/**"
      - ".github/workflows/CI.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: Python Syntax Check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile skills.py

  dry-run:
    name: Dry-Run Validation (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install git
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Dry-run recommended
        run: python skills.py --dry-run
      - name: Dry-run trusted
        run: python skills.py --dry-run trusted
      - name: Dry-run all
        run: python skills.py --dry-run all
      - name: Dry-run single category
        run: python skills.py --dry-run K2
      - name: Dry-run multiple categories
        run: python skills.py --dry-run K2 K4 K6
      - name: Version flag
        run: python skills.py --version
      - name: Help flag
        run: python skills.py --help
      - name: List categories
        run: python skills.py --list
      - name: Installer safety selftest
        run: python Scripts/check_install_safety.py --selftest
      - name: Installer safety unit tests
        run: python Scripts/check_install_safety.py

  integration:
    name: Pinned Source Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
      - name: Verify real clone, pin and skill inventory
        run: python Scripts/check_install_integration.py
      - name: Evaluate inventory drift across all sources
        continue-on-error: true
        run: python Scripts/check_install_integration.py --all

  cross-platform:
    name: Cross-Platform (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile skills.py
      - name: Version info
        run: python skills.py --version
      - name: Help text
        run: python skills.py --help
      - name: List categories
        run: python skills.py --list
      - name: Installer safety unit tests (includes Windows junction)
        run: python Scripts/check_install_safety.py
